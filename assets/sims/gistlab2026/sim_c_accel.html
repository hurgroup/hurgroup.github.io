<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>0 to 60 mph — GIST Lab Simulation</title>
<style>
/* kit.css - shared look for the GIST Lab Roadster simulations (projector-friendly dark theme). */
:root {
  --bg: #05070a;
  --panel: #0d1116;
  --panel-2: #141a21;
  --line: #222a33;
  --line-2: #2e3742;
  --ink: #eef2f6;
  --ink-2: #a3aeba;
  --ink-3: #66717d;
  --accent: #e8473b;
  --gold: #ffd84d;
  --ok: #3ddc84;
  --warn: #ffb020;
  --bad: #ff5a5a;
  /* force colors: use the same color for the same force in every simulation */
  --f-gravity: #b48cff;
  --f-normal: #3ddc84;
  --f-friction: #ffb020;
  --f-suction: #ff6bd6;
  --f-thrust: #62c6ff;
  --f-drag: #a3aeba;
  --f-velocity: #ffffff;
  --side-w: clamp(300px, 23vw, 400px);
  --plots-h: clamp(150px, 25vh, 270px);
  --top-h: 58px;
  font-size: 16px;
}
@media (min-width: 1700px) { :root { font-size: 18px; } }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  display: grid;
  grid-template-rows: var(--top-h) minmax(0, 1fr) var(--plots-h);
  grid-template-columns: 1fr var(--side-w);
  grid-template-areas: "top top" "stage side" "plots side";
  overflow: hidden;
}

/* top bar */
.kit-top {
  grid-area: top; display: flex; align-items: center; gap: 18px;
  padding: 0 18px; border-bottom: 1px solid var(--line); background: var(--panel);
  min-width: 0;
}
.kit-top a.kit-back { color: var(--ink-2); text-decoration: none; font-size: 0.9rem; white-space: nowrap; }
.kit-top a.kit-back:hover { color: var(--ink); }
.kit-top h1 { font-size: 1.25rem; margin: 0; font-weight: 700; letter-spacing: 0.01em; white-space: nowrap; }
.kit-top .kit-sub { color: var(--ink-2); font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.kit-top .kit-spacer { flex: 1; }

/* stage */
.kit-stage { grid-area: stage; position: relative; overflow: hidden; background: #000; min-height: 0; }
.kit-stage > canvas.kit-main-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.kit-hud {
  position: absolute; left: 0; right: 0; bottom: 10px; display: flex; justify-content: space-between;
  align-items: flex-end; padding: 0 16px; pointer-events: none; gap: 10px;
}
.kit-hud .kit-hud-group { display: flex; gap: 10px; align-items: flex-end; }
.kit-gauge { width: 118px; height: 118px; }
.kit-gauge canvas { width: 100%; height: 100%; display: block; }
.kit-timer {
  position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%);
  font: italic 700 2.2rem/1 "Avenir Next Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  letter-spacing: 0.02em; color: #fff; text-shadow: 0 2px 8px #000; pointer-events: none;
}
.kit-badge {
  position: absolute; top: 12px; left: 14px; padding: 6px 10px; border-radius: 6px;
  background: rgba(13,17,22,0.8); border: 1px solid var(--line-2); color: var(--ink-2); font-size: 0.85rem;
}
.kit-badge b { color: var(--ink); }
.kit-badge:empty { display: none; }
.kit-status {
  position: absolute; top: 12px; right: 14px; padding: 8px 14px; border-radius: 8px;
  font-weight: 700; font-size: 1.05rem; background: rgba(13,17,22,0.85); border: 1px solid var(--line-2);
}
.kit-status.ok { color: var(--ok); border-color: var(--ok); }
.kit-status.warn { color: var(--warn); border-color: var(--warn); }
.kit-status.bad { color: var(--bad); border-color: var(--bad); }

/* plots */
.kit-plots {
  grid-area: plots; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 1px;
  background: var(--line); border-top: 1px solid var(--line); min-height: 0;
  grid-template-rows: minmax(0, 1fr); overflow: hidden;
}
.kit-plots canvas { width: 100%; height: 100%; display: block; background: var(--panel); min-width: 0; min-height: 0; }

/* side panel */
.kit-side {
  grid-area: side; background: var(--panel); border-left: 1px solid var(--line);
  overflow-y: auto; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 14px; min-height: 0;
}
.kit-section h2 {
  font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-3);
  margin: 0 0 8px; font-weight: 700;
}
.kit-transport { display: flex; flex-wrap: wrap; gap: 6px; }
.kit-btn {
  appearance: none; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--ink);
  border-radius: 8px; padding: 8px 12px; font: inherit; font-size: 0.92rem; cursor: pointer; line-height: 1.1;
}
.kit-btn:hover { border-color: var(--ink-3); }
.kit-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; min-width: 92px; }
.kit-btn.on { border-color: var(--gold); color: var(--gold); }
.kit-seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; }
.kit-seg button {
  appearance: none; border: 0; background: var(--panel-2); color: var(--ink-2); font: inherit; font-size: 0.85rem;
  padding: 7px 9px; cursor: pointer; border-right: 1px solid var(--line-2);
}
.kit-seg button:last-child { border-right: 0; }
.kit-seg button.on { background: var(--ink); color: #000; font-weight: 700; }
.kit-presets { display: flex; flex-wrap: wrap; gap: 6px; }
.kit-presets .kit-btn.on { background: var(--ink); color: #000; border-color: var(--ink); font-weight: 700; }

.kit-slider { margin: 2px 0 10px; }
.kit-slider-head { display: flex; justify-content: space-between; gap: 8px; font-size: 0.9rem; color: var(--ink-2); margin-bottom: 3px; }
.kit-slider-head b { color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.kit-slider input[type=range] { width: 100%; accent-color: var(--accent); }
.kit-check { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--ink-2); margin: 4px 0; cursor: pointer; }
.kit-check input { accent-color: var(--accent); width: 16px; height: 16px; }

.kit-readouts { display: grid; grid-template-columns: 1fr auto; gap: 5px 10px; font-size: 0.92rem; }
.kit-readouts .k { color: var(--ink-2); }
.kit-readouts .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.kit-readouts .v.ok { color: var(--ok); }
.kit-readouts .v.warn { color: var(--warn); }
.kit-readouts .v.bad { color: var(--bad); }
.kit-readouts .v.gold { color: var(--gold); }

.kit-explain { font-size: 0.9rem; color: var(--ink-2); line-height: 1.45; }
.kit-explain summary { cursor: pointer; color: var(--ink); font-weight: 600; margin-bottom: 6px; }
.kit-explain p { margin: 6px 0; }
.kit-explain .eq {
  font-family: "STIX Two Math", "Cambria Math", "Times New Roman", serif; font-size: 1.05rem; color: var(--ink);
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; margin: 6px 0;
}
.kit-legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 0.82rem; color: var(--ink-2); }
.kit-legend span::before { content: ""; display: inline-block; width: 12px; height: 4px; border-radius: 2px; margin-right: 5px; vertical-align: middle; background: var(--c); }
.kit-note { font-size: 0.78rem; color: var(--ink-3); line-height: 1.4; }

/* predict overlay */
.kit-predict {
  position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.72); backdrop-filter: blur(3px); z-index: 5;
}
.kit-predict.show { display: flex; }
.kit-predict .card {
  width: min(860px, 88%); background: var(--panel); border: 1px solid var(--line-2); border-radius: 14px;
  padding: 28px 32px; box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}
.kit-predict .tag { color: var(--gold); font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; font-size: 0.85rem; }
.kit-predict h3 { font-size: 1.9rem; line-height: 1.25; margin: 10px 0 18px; }
.kit-predict .choices { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
.kit-predict .choices button {
  appearance: none; font: inherit; font-size: 1.15rem; padding: 12px 18px; border-radius: 999px; cursor: pointer;
  background: var(--panel-2); color: var(--ink); border: 1px solid var(--line-2);
}
.kit-predict .choices button.on { border-color: var(--gold); color: var(--gold); }
.kit-predict .hint { color: var(--ink-2); font-size: 1rem; margin: 0 0 18px; }
.kit-predict .go { font-size: 1.15rem; padding: 12px 22px; }

/* errors (also visible in headless screenshots) */
#kit-errors {
  display: none; position: fixed; left: 10px; bottom: 10px; z-index: 99; max-width: 60vw; white-space: pre-wrap;
  background: #300; color: #fbb; border: 1px solid #f55; padding: 8px 10px; font: 12px/1.4 ui-monospace, Menlo, monospace;
}

</style>
<style>
  .keytab { width: 100%; border-collapse: collapse; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
  .keytab th, .keytab td { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: right; }
  .keytab th:first-child, .keytab td:first-child { text-align: left; }
  .keytab th { color: var(--ink-3); font-weight: 600; font-size: 0.78rem; }
  .keytab tr.hl td { color: var(--gold); font-weight: 700; }
  /* while the predict card is up, hide everything that gives the answer away */
  body.predicting .kit-plots, body.predicting .hide-when-predicting { visibility: hidden; }
</style>

<script>
/* sim_c_physics.js - 1D straight-line acceleration model for SIM-C (0 -> 60 mph).
   m dv/dt = min(F_motor(v), mu (m g + F_s)) + T - 0.5 rho CdA v^2 - Crr (m g + F_s)
   F_motor(v) = min(F_max, P_max / v), F_s = k m g (fan suction), T = thruster force.
   Pure functions: pass the lane config and the common params (g, rho_air). */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory(require('./integrate.js'));
  else root.SimC = factory(root.Integrate);
})(typeof self !== 'undefined' ? self : this, function (Integrate) {
  'use strict';
  const MPH = 0.44704, FT = 0.3048;
  const V60 = 60 * MPH;

  // All forces at speed v (N). cfg: mass, mu, k, thrust_kN, pmax_MW, fmax_kN, cda, crr.
  function forces(cfg, v, common) {
    const g = common.g, m = cfg.mass;
    const Fs = cfg.k * m * g;
    const N = m * g + Fs;
    const Fgrip = cfg.mu * N;
    const Fmax = cfg.fmax_kN * 1e3, Pmax = cfg.pmax_MW * 1e6;
    const Fpow = v > 1e-9 ? Pmax / v : Infinity;
    const Fmotor = Math.min(Fmax, Fpow);
    const Fdrive = Math.min(Fmotor, Fgrip);
    const limit = Fgrip <= Fmotor ? 'tire grip' : (Fpow < Fmax ? 'motor power' : 'motor force');
    const T = (cfg.thrust_kN || 0) * 1e3;
    const Fdrag = 0.5 * common.rho_air * cfg.cda * v * v;
    const Frr = cfg.crr * N;
    const Fnet = Fdrive + T - Fdrag - Frr;
    const a = v <= 0 && Fnet < 0 ? 0 : Fnet / m;
    return { Fs, N, Fgrip, Fmotor, Fdrive, T, Fdrag, Frr, Fnet, a, power: Fdrive * v, limit };
  }

  function newRun(cfg, common) {
    const F = forces(cfg, 0, common);
    return { t: 0, x: 0, v: 0, a: F.a, peakA: F.a, limit: F.limit, t60: null, x60: null, tRoll: null, p60: null, done: false };
  }

  // Advance one step of dt. With stopAt60 the run ends exactly at 60 mph (interpolated crossing).
  function stepRun(r, cfg, common, dt, stopAt60 = true) {
    if (r.done) return r;
    const f = (t, y) => [y[1], forces(cfg, y[1], common).a];
    const y1 = Integrate.rk4(f, r.t, [r.x, r.v], dt);
    const t1 = r.t + dt;
    const rollX = (cfg.rollout_ft || 0) * FT;
    if (rollX > 0 && r.tRoll === null && y1[0] >= rollX) r.tRoll = Integrate.crossing(r.t, r.x - rollX, t1, y1[0] - rollX);
    if (r.t60 === null && y1[1] >= V60) {
      r.t60 = Integrate.crossing(r.t, r.v - V60, t1, y1[1] - V60);
      const s = (r.t60 - r.t) / dt;
      r.x60 = r.x + s * (y1[0] - r.x);
      const F = forces(cfg, V60, common);
      r.p60 = F.power;
      if (stopAt60) {
        r.t = r.t60; r.x = r.x60; r.v = V60; r.a = F.a; r.limit = F.limit;
        if (F.a > r.peakA) r.peakA = F.a;
        r.done = true;
        return r;
      }
    }
    r.t = t1; r.x = y1[0]; r.v = y1[1];
    const F = forces(cfg, r.v, common);
    r.a = F.a; r.limit = F.limit;
    if (F.a > r.peakA) r.peakA = F.a;
    return r;
  }

  // Reported 0-60 time: subtract the 1-ft rollout when the lane's official figure uses it.
  function reported(r, cfg) {
    if (r.t60 === null) return null;
    return r.t60 - (cfg.rollout_ft ? r.tRoll || 0 : 0);
  }

  function simulate(cfg, common, dt = 1e-3, tmax = 30) {
    const r = newRun(cfg, common);
    while (!r.done && r.t < tmax) stepRun(r, cfg, common, dt);
    return { t60: r.t60, x60: r.x60, reported: reported(r, cfg), peakG: r.peakA / common.g, p60: r.p60, tRoll: r.tRoll };
  }

  // Find the value of cfg[key] in [lo, hi] that gives the target reported time (bisection).
  function tune(cfg, key, target, lo, hi, common, iters = 45) {
    const time = (val) => simulate(Object.assign({}, cfg, { [key]: val }), common).reported ?? Infinity;
    let a = lo, b = hi;
    const dec = time(a) > time(b);
    for (let i = 0; i < iters; i++) {
      const mid = 0.5 * (a + b);
      if ((time(mid) > target) === dec) a = mid; else b = mid;
    }
    return 0.5 * (a + b);
  }

  return { MPH, FT, V60, forces, newRun, stepRun, reported, simulate, tune };
});

<script>
'use strict';
const C = window.PARAMS.common, SC = window.PARAMS.sim_c, YC = SC.your_car;
const g = C.g, MPH = SimC.MPH, V60 = SimC.V60;
const LANES = SC.lanes;
const HIDDEN = ['fmax_kN', 'cda', 'crr'];           // Your-car fields not on sliders (set by presets)

let your = Object.assign({}, YC, YC.presets.video);
let runs = [], yrun = null, simT = 0, finished = false, showForces = true, rec = [], lastRec = 0;

// ---------- small drawing helpers (local to this page) ----------
function rrect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}
function fitText(ctx, text, maxW) {
  if (ctx.measureText(text).width <= maxW) return text;
  let t = text;
  while (t.length > 3 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
  return t + '…';
}
function cfgLine(c) {
  const parts = ['μ ' + c.mu.toFixed(2)];
  parts.push(c.k > 0 ? 'suction ' + c.k.toFixed(1) + ' mg' : 'no suction');
  if (c.thrust_kN > 0) parts.push('thrust ' + c.thrust_kN.toFixed(1) + ' kN');
  parts.push((c.pmax_MW >= 1 ? c.pmax_MW.toFixed(1) : c.pmax_MW.toFixed(2)) + ' MW');
  return parts.join(' · ');
}
function drawCar(ctx, xf, yc, L, W, color, plume) {
  ctx.save();
  if (plume > 0) {
    const pl = L * (0.5 + plume);
    const grd = ctx.createLinearGradient(xf - L, 0, xf - L - pl, 0);
    grd.addColorStop(0, 'rgba(225,242,255,0.9)'); grd.addColorStop(1, 'rgba(225,242,255,0)');
    ctx.fillStyle = grd; ctx.beginPath();
    ctx.moveTo(xf - L + 2, yc - W * 0.28); ctx.lineTo(xf - L - pl, yc - W * 0.75);
    ctx.lineTo(xf - L - pl, yc + W * 0.75); ctx.lineTo(xf - L + 2, yc + W * 0.28); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = '#030303';
  const ww = L * 0.17, wh = W * 0.2;
  for (const fx of [0.2, 0.78]) for (const s of [-1, 1]) ctx.fillRect(xf - L * fx - ww / 2, yc + s * W / 2 - wh / 2, ww, wh);
  rrect(ctx, xf - L, yc - W / 2, L, W, W * 0.38); ctx.fillStyle = color; ctx.fill();
  rrect(ctx, xf - L * 0.64, yc - W * 0.32, L * 0.38, W * 0.64, W * 0.22); ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fill();
  ctx.restore();
}

// ---------- state ----------
function reset() {
  runs = LANES.map((l) => SimC.newRun(l, C));
  yrun = SimC.newRun(your, C);
  simT = 0; finished = false; rec = [[0, 0, 0, yrun.a]]; lastRec = 0;
  const pred = SimC.simulate(your, C, SC.dt, SC.tmax);
  const tEnd = Math.min(SC.tmax, Math.max(3, (pred.t60 || SC.tmax) * 1.15));
  for (const p of [p1, p2, p3]) { p.clear(); p.base.x1 = tEnd; p.x1 = tEnd; }
  p2.hlines = [
    { y: your.mu, label: `tires only (no suction): μg = ${your.mu.toFixed(2)} g`, color: 'rgba(255,176,32,0.9)' },
    { y: 3.38, label: 'average needed for 0.81 s: 3.38 g', color: 'rgba(255,216,77,0.75)' },
  ];
  pushPlots(true);
  updateReadouts();
}
function lastT60() { return Math.max(...runs.map((r) => r.t60 || 0), yrun.t60 || 0); }

function step(dt) {
  simT += dt;
  runs.forEach((r, i) => { if (!r.done) SimC.stepRun(r, LANES[i], C, dt); });
  if (!yrun.done) SimC.stepRun(yrun, your, C, dt);
  if (simT - lastRec >= 0.005 || (yrun.done && rec[rec.length - 1][0] < yrun.t)) {
    if (!yrun.done || rec[rec.length - 1][0] < yrun.t) rec.push([yrun.t, yrun.x, yrun.v, yrun.a]);
    lastRec = simT;
  }
  pushPlots(false);
  const allDone = (yrun.done && runs.every((r) => r.done));
  if ((allDone && simT > lastT60() + 0.3) || simT >= SC.tmax) { finished = true; return false; }
  return true;
}

function pushPt(p, i, x, y, force) {
  if (force) { const d = p.series[i].data; if (!d.length || x > d[d.length - 1][0]) d.push([x, y]); }
  else p.push(i, x, y);
}
function pushPlots(force) {
  runs.forEach((r, i) => {
    if (r._fin) return;
    pushPt(p1, i, r.t, r.v / MPH, force || r.done);
    if (r.done) r._fin = true;

  if (!yrun._fin) {
    const F = SimC.forces(your, yrun.v, C), f = force || yrun.done, t = yrun.t;
    pushPt(p1, LANES.length, t, yrun.v / MPH, f);
    pushPt(p2, 0, t, yrun.a / g, f);
    pushPt(p3, 0, t, F.Fgrip / 1e3, f);
    pushPt(p3, 1, t, Math.min(F.Fmotor, 2e5) / 1e3, f);
    pushPt(p3, 2, t, F.Fdrive / 1e3, f);
    pushPt(p3, 3, t, F.T / 1e3, f);
    pushPt(p3, 4, t, F.Fdrag / 1e3, f);

// ---------- drawing ----------
const cv = document.getElementById('cv');
function drawStage() {
  const { ctx, w, h } = Kit.fitCanvas(cv);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
  const n = LANES.length + 1;
  const top = 50, bottom = h - 168;
  const laneH = (bottom - top) / n;
  const LW = Kit.clamp(w * 0.21, 220, 330);
  const xEnd = w - 24;
  const carLen = C.car_length_m;
  const scale = (xEnd - LW - 14) / (SC.strip_m + carLen);
  const x0 = LW + 14 + carLen * scale;
  const fs = Math.max(0.82, Math.min(1, laneH / 78));

  // track surface and rulers (like the drag strip in the stream)
  ctx.fillStyle = '#15181c'; ctx.fillRect(LW, top - 10, w - LW, bottom - top + 20);
  ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2;
  ctx.font = `600 ${Math.round(12 * Math.max(fs, 0.85))}px -apple-system, Segoe UI, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  for (const [yy, dir] of [[top - 10, -1], [bottom + 10, 1]]) {
    ctx.beginPath(); ctx.moveTo(x0, yy); ctx.lineTo(xEnd, yy); ctx.stroke();
    for (let m = 0; m <= SC.strip_m; m++) {
      const x = x0 + m * scale, len = m % 5 === 0 ? 12 : 6;
      ctx.beginPath(); ctx.moveTo(x, yy); ctx.lineTo(x, yy + dir * len); ctx.stroke();
      if (dir < 0 && m % 5 === 0) ctx.fillText(m + ' m', x, yy - 14);
    }
  }
  ctx.textBaseline = 'top'; ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillText('distance from the start line', (x0 + xEnd) / 2, bottom + 26);
  // start line
  ctx.fillStyle = '#fff'; ctx.fillRect(x0 - 2, top - 10, 4, bottom - top + 20);

  for (let i = 0; i < n; i++) {
    const isYou = i === LANES.length;
    const cfg = isYou ? your : LANES[i], r = isYou ? yrun : runs[i];
    const color = isYou ? YC.color : cfg.color;
    const y0 = top + laneH * i, yc = y0 + laneH / 2;
    if (i > 0) {
      ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.setLineDash([14, 12]); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(LW, y0); ctx.lineTo(w, y0); ctx.stroke(); ctx.setLineDash([]);
    }
    if (isYou) { ctx.fillStyle = 'rgba(255,216,77,0.07)'; ctx.fillRect(0, y0 + 1, w, laneH - 2); }

    // label column
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillStyle = color; ctx.font = `700 ${Math.round(17 * fs)}px -apple-system, Segoe UI, sans-serif`;
    ctx.fillText(fitText(ctx, isYou ? 'Your car (sliders)' : cfg.label, LW - 24), 14, yc - laneH * 0.24);
    ctx.fillStyle = '#c3ccd5'; ctx.font = `${Math.round(13 * fs)}px -apple-system, Segoe UI, sans-serif`;
    ctx.fillText(fitText(ctx, cfgLine(cfg), LW - 24), 14, yc + laneH * 0.03);
    ctx.fillStyle = '#7d8894'; ctx.font = `${Math.round(12 * fs)}px -apple-system, Segoe UI, sans-serif`;
    ctx.fillText(fitText(ctx, isYou ? 'mass ' + cfg.mass + ' kg' : cfg.basis, LW - 24), 14, yc + laneH * 0.27);

    // car
    const Lpx = carLen * scale, Wpx = Math.min(laneH * 0.52, C.car_width_m * scale);
    let xf = x0 + r.x * scale;
    const off = xf > xEnd;
    ctx.save(); ctx.beginPath(); ctx.rect(LW, y0, xEnd - LW, laneH); ctx.clip();
    if (off) xf = xEnd + Lpx * 0.3;
    const thrusting = cfg.thrust_kN > 0 && !r.done && r.t > 0;
    drawCar(ctx, xf, yc, Lpx, Wpx, isYou ? YC.color : color, thrusting ? Math.min(1.2, cfg.thrust_kN / 10 + 0.3) : 0);
    ctx.restore();

    // 60 mph marker and labels
    ctx.textBaseline = 'middle';
    if (r.done) {
      const xm = off ? xEnd : x0 + r.x60 * scale;
      ctx.strokeStyle = 'rgba(255,216,77,0.9)'; ctx.setLineDash([5, 4]); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(xm, y0 + 4); ctx.lineTo(xm, y0 + laneH - 4); ctx.stroke(); ctx.setLineDash([]);
      const rep = SimC.reported(r, cfg);
      const txt = rep.toFixed(2) + ' s · ' + r.x60.toFixed(1) + ' m' + (off ? ' →' : '');
      ctx.font = `700 ${Math.round(17 * fs)}px -apple-system, Segoe UI, sans-serif`;
      const tw = ctx.measureText(txt).width;
      let tx = xm + 10, align = 'left';
      if (off || tx + tw > xEnd) { tx = (off ? xEnd - Lpx * 0.75 : xm - Lpx) - 10; align = 'right'; }
      ctx.textAlign = align; ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,0.85)';
      ctx.strokeText(txt, tx, yc); ctx.fillStyle = color; ctx.fillText(txt, tx, yc);
    } else if (r.t > 0 || isYou) {
      const txt = (r.v / MPH).toFixed(0) + ' mph';
      ctx.font = `600 ${Math.round(14 * fs)}px -apple-system, Segoe UI, sans-serif`;
      ctx.textAlign = 'left'; ctx.fillStyle = '#c3ccd5';
      const ty = isYou && showForces ? y0 + laneH * 0.16 : yc;
      ctx.fillText(txt, Math.min(xf + 8, xEnd - 60), ty);

      if (F.T > 0) Kit.arrow(ctx, xfr + 4, yc + Wpx * 0.25, len(F.T), 0, { color: Kit.css('--f-thrust'), label: 'thrust ' + (F.T / 1e3).toFixed(1) + ' kN', font, width: 3 });

  }
}

function draw() {
  drawStage();
  const F = SimC.forces(your, yrun.v, C);
  gSpeed.set(yrun.v / MPH); gG.set(yrun.a / g); gDown.set(your.k * your.mass); gPow.set(yrun.done ? (yrun.p60 || 0) / 1e6 : F.power / 1e6);

  updateReadouts();
}

function updateReadouts() {
  if (!yrun) return;

  ro.set('t60', rep !== null ? rep.toFixed(2) + ' s' : simT >= SC.tmax ? 'not reached in 12 s' : (simT > 0 ? 'running…' : '—'), rep !== null ? 'gold' : '');
  ro.set('x60', yrun.x60 !== null ? yrun.x60.toFixed(1) + ' m' : '—');
  ro.set('peak', (yrun.peakA / g).toFixed(2) + ' g');
  ro.set('p60', yrun.p60 !== null ? (yrun.p60 / 1e6).toFixed(2) + ' MW (' + Math.round(yrun.p60 / 745.7).toLocaleString() + ' hp)' : '—');
  ro.set('limit', yrun.done ? '—' : yrun.limit, yrun.limit === 'tire grip' ? 'warn' : '');
  ro.set('down', Math.round(your.k * your.mass).toLocaleString() + ' kgf');
  ro.set('best0', (V60 / (your.mu * g)).toFixed(2) + ' s');
  ro.set('bestk', (V60 / (your.mu * g * (1 + your.k))).toFixed(2) + ' s');
}

// ---------- UI ----------
const laneSeries = LANES.map((l) => ({ name: '', color: l.color, width: 1.5 }));
const p1 = new Kit.Plot(document.getElementById('p1'), {
  title: 'Speed (all lanes)', ylabel: 'mph', xmax: 3, ymax: 70, autoX: false,
  series: laneSeries.concat([{ name: 'Your car', color: YC.color, width: 3 }]),
  hlines: [{ y: 60, label: '60 mph', color: 'rgba(255,255,255,0.55)' }],
});
const p2 = new Kit.Plot(document.getElementById('p2'), {
  title: 'Acceleration of Your car', ylabel: 'g', xmax: 3, ymax: 4, autoX: false, autoY: true,
  series: [{ name: 'Your car', color: YC.color, width: 3 }],
});
const p3 = new Kit.Plot(document.getElementById('p3'), {
  title: 'Forces', ylabel: 'kN', xmax: 3, ymax: 80, autoX: false, autoY: true,
  series: [
    { name: 'grip limit', color: Kit.css('--f-friction'), width: 1.5, dash: [5, 4] },
    { name: '', color: '#8fd3ff', width: 1.5, dash: [2, 3] },
    { name: 'drive', color: Kit.css('--f-friction'), width: 2.5 },
    { name: 'thrust', color: Kit.css('--f-thrust'), width: 2 },
    { name: 'drag', color: Kit.css('--f-drag'), width: 2 },
  ],
});
const gSpeed = new Kit.Gauge(document.getElementById('hudL'), { label: 'SPEED', unit: 'MPH', max: 70, digits: 1 });
const gG = new Kit.Gauge(document.getElementById('hudL'), { label: 'G-FORCE', unit: 'G', max: 4, digits: 2 });
const gDown = new Kit.Gauge(document.getElementById('hudR'), { label: 'DOWNFORCE', unit: 'KG', max: 6000, digits: 0 });
const gPow = new Kit.Gauge(document.getElementById('hudR'), { label: 'POWER', unit: 'MW', max: 3, digits: 2 });

const loop = new Kit.Loop({ dt: SC.dt, step, draw });
const side = document.getElementById('side');
const tr = Kit.transport(Kit.section(side, 'Run'), loop, {
  onPlay: () => { if (finished) reset(); loop.toggle(); },
  onReset: () => { reset(); loop.pause(); },
  onForces: () => { showForces = !showForces; tr.setForces(showForces); },
  onPredict: () => pred.toggle(),
  onExport: () => Kit.downloadCSV('sim_c_your_car.csv', ['t_s', 'x_m', 'v_mps', 'a_mps2'], rec),
});
tr.setForces(showForces);

const presetBox = Kit.section(side, 'Your car presets');
const carBox = Kit.section(side, 'Your car');
const S = YC.sliders;
function fromSliders() {
  your.mass = sl.mass.value; your.mu = sl.mu.value; your.k = sl.k.value; your.thrust_kN = sl.thrust_kN.value; your.pmax_MW = sl.pmax_MW.value;
}
function onSlider() { presets.clear(); fromSliders(); reset(); loop.pause(); }
const sl = {
  mass: Kit.slider(carBox, { label: 'Mass', min: S.mass.min, max: S.mass.max, step: S.mass.step, value: your.mass, unit: 'kg', fmt: (v) => v.toLocaleString(), onInput: onSlider }),
  mu: Kit.slider(carBox, { label: 'Tire grip μ', min: S.mu.min, max: S.mu.max, step: S.mu.step, value: your.mu, fmt: (v) => v.toFixed(2), onInput: onSlider }),
  k: Kit.slider(carBox, { label: 'Fan suction', min: S.k.min, max: S.k.max, step: S.k.step, value: your.k, unit: '× mg', fmt: (v) => v.toFixed(1), onInput: onSlider }),
  thrust_kN: Kit.slider(carBox, { label: 'Thruster force', min: S.thrust_kN.min, max: S.thrust_kN.max, step: S.thrust_kN.step, value: your.thrust_kN, unit: 'kN', fmt: (v) => v.toFixed(1), onInput: onSlider }),
  pmax_MW: Kit.slider(carBox, { label: 'Max motor power', min: S.pmax_MW.min, max: S.pmax_MW.max, step: S.pmax_MW.step, value: your.pmax_MW, unit: 'MW', fmt: (v) => v.toFixed(2), onInput: onSlider }),
};

const resBox = Kit.section(side, 'Your car results');
resBox.classList.add('hide-when-predicting');
const ro = Kit.readouts(resBox, [
  { key: 't60', label: '0–60 mph time' },
  { key: 'x60', label: 'Distance to 60 mph' },
  { key: 'peak', label: 'Peak acceleration' },
  { key: 'p60', label: 'Power at 60 mph' },
  { key: 'limit', label: 'Limited by (now)' },
  { key: 'down', label: 'Suction force' },
  { key: 'best0', label: 'Best with tires only (μg)' },
  { key: 'bestk', label: 'Best with grip + suction' },
]);

const keyBox = Kit.section(side, 'Key numbers');
keyBox.classList.add('hide-when-predicting');
keyBox.insertAdjacentHTML('beforeend', `<table class="keytab">
  <tr><th>0–60 mph time</th><th>average a</th><th>in g</th></tr>
  <tr><td>1.90 s</td><td>14.1 m/s²</td><td>1.44 g</td></tr>
  <tr><td>1.60 s</td><td>16.8 m/s²</td><td>1.71 g</td></tr>
  <tr><td>1.00 s</td><td>26.8 m/s²</td><td>2.74 g</td></tr>
  <tr class="hl"><td>0.81 s</td><td>33.1 m/s²</td><td>3.38 g</td></tr>
</table>`);

side.insertAdjacentHTML('beforeend', `<details class="kit-explain hide-when-predicting" open>
  <summary>Explain the physics</summary>
  <p>Average acceleration:</p>
  <div class="eq">a = Δv / Δt = 26.8 m/s ÷ 0.81 s = 33.1 m/s² ≈ 3.4 g</div>
  <p>Tires push the car forward by friction. The most they can give is</p>
  <div class="eq">f ≤ μN</div>
  <p>Fans that suck the car onto the road raise the normal force:</p>
  <div class="eq">N = mg + F<sub>s</sub></div>
  <p>So the best acceleration from grip is a ≤ μ(g + F<sub>s</sub>/m). With μ = 1.1 and F<sub>s</sub> = 2mg: a ≤ 3.3 g, about 0.83 s.</p>
  <p>Motors are limited by power:</p>
  <div class="eq">P = F v</div>
  <p>At 60 mph, a 1.9 t car pulling 3.4 g needs about 1.7 MW (2,200 hp). Thrusters push gas backward, and the gas pushes the car forward (action and reaction).</p>
</details>
<p class="kit-note">Teaching model. Event numbers as reported (Tesla live stream, 2026-10-15); mass, suction and thrust are assumptions. Plaid and 2017 Roadster times use the 1-ft rollout convention (the clock starts after the first foot). Each lane's settings are tuned to match its time.</p>
<p class="kit-note">Keys: Space play/pause · R reset · → step · S slower · F forces · P predict</p>`);

const presetList = Object.entries(YC.presets).map(([key, p]) => ({
  key, label: p.label,
  apply: () => {
    your = Object.assign({}, YC, p);
    HIDDEN.forEach((h) => { if (p[h] === undefined) your[h] = YC[h]; });
    if (typeof sl !== 'undefined') ['mass', 'mu', 'k', 'thrust_kN', 'pmax_MW'].forEach((f) => sl[f].set(your[f]));
    reset(); loop.pause();
  },
}));
const presets = Kit.presets(presetBox, presetList);
presetBox.parentNode.insertBefore(presetBox, carBox);

const pred = new Kit.Predict(document.getElementById('stage'), {
  question: 'To reach 60 mph in 0.81 s, how many g would you feel?',
  choices: ['1 g', '2 g', '3.4 g', '10 g'],
  hint: 'Then ask: can tires alone do it?',
  onGo: () => { reset(); loop.play(); },
});
pred.onToggle = (on) => { tr.setPredict(on); document.body.classList.toggle('predicting', on); };

presets.select(YC.presets[Kit.qs.preset] ? Kit.qs.preset : 'video');
if (Kit.qs.t) loop.runTo(+Kit.qs.t, () => simT);
else if (Kit.qs.predict !== '0') pred.show();
</script>
</body>
</html>
