<style>
/* kit.css - shared look for the GIST Lab Roadster simulations (projector-friendly dark theme). */
:root {
  --bg: #05070a;
  --panel: #0d1116;
  --panel-2: #141a21;
  --line: #222a33;
  --line-2: #2e3742;
  --ink: #eef2f6;
  --ink-2: #a3aeba;
  --ink-3: #66717d;
  --accent: #e8473b;
  --gold: #ffd84d;
  --ok: #3ddc84;
  --warn: #ffb020;
  --bad: #ff5a5a;
  /* force colors: use the same color for the same force in every simulation */
  --f-gravity: #b48cff;
  --f-normal: #3ddc84;
  --f-friction: #ffb020;
  --f-suction: #ff6bd6;
  --f-thrust: #62c6ff;
  --f-drag: #a3aeba;
  --f-velocity: #ffffff;
  --side-w: clamp(300px, 23vw, 400px);
  --plots-h: clamp(150px, 25vh, 270px);
  --top-h: 58px;
  font-size: 16px;
}
@media (min-width: 1700px) { :root { font-size: 18px; } }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  display: grid;
  grid-template-rows: var(--top-h) minmax(0, 1fr) var(--plots-h);
  grid-template-columns: 1fr var(--side-w);
  grid-template-areas: "top top" "stage side" "plots side";
  overflow: hidden;
}

/* top bar */
.kit-top {
  grid-area: top; display: flex; align-items: center; gap: 18px;
  padding: 0 18px; border-bottom: 1px solid var(--line); background: var(--panel);
  min-width: 0;
}
.kit-top a.kit-back { color: var(--ink-2); text-decoration: none; font-size: 0.9rem; white-space: nowrap; }
.kit-top a.kit-back:hover { color: var(--ink); }
.kit-top h1 { font-size: 1.25rem; margin: 0; font-weight: 700; letter-spacing: 0.01em; white-space: nowrap; }
.kit-top .kit-sub { color: var(--ink-2); font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.kit-top .kit-spacer { flex: 1; }

/* stage */
.kit-stage { grid-area: stage; position: relative; overflow: hidden; background: #000; min-height: 0; }
.kit-stage > canvas.kit-main-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.kit-hud {
  position: absolute; left: 0; right: 0; bottom: 10px; display: flex; justify-content: space-between;
  align-items: flex-end; padding: 0 16px; pointer-events: none; gap: 10px;
}
.kit-hud .kit-hud-group { display: flex; gap: 10px; align-items: flex-end; }
.kit-gauge { width: 118px; height: 118px; }
.kit-gauge canvas { width: 100%; height: 100%; display: block; }
.kit-timer {
  position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%);
  font: italic 700 2.2rem/1 "Avenir Next Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  letter-spacing: 0.02em; color: #fff; text-shadow: 0 2px 8px #000; pointer-events: none;
}
.kit-badge {
  position: absolute; top: 12px; left: 14px; padding: 6px 10px; border-radius: 6px;
  background: rgba(13,17,22,0.8); border: 1px solid var(--line-2); color: var(--ink-2); font-size: 0.85rem;
}
.kit-badge b { color: var(--ink); }
.kit-badge:empty { display: none; }
.kit-status {
  position: absolute; top: 12px; right: 14px; padding: 8px 14px; border-radius: 8px;
  font-weight: 700; font-size: 1.05rem; background: rgba(13,17,22,0.85); border: 1px solid var(--line-2);
}
.kit-status.ok { color: var(--ok); border-color: var(--ok); }
.kit-status.warn { color: var(--warn); border-color: var(--warn); }
.kit-status.bad { color: var(--bad); border-color: var(--bad); }

/* plots */
.kit-plots {
  grid-area: plots; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 1px;
  background: var(--line); border-top: 1px solid var(--line); min-height: 0;
  grid-template-rows: minmax(0, 1fr); overflow: hidden;
}
.kit-plots canvas { width: 100%; height: 100%; display: block; background: var(--panel); min-width: 0; min-height: 0; }

/* side panel */
.kit-side {
  grid-area: side; background: var(--panel); border-left: 1px solid var(--line);
  overflow-y: auto; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 14px; min-height: 0;
}
.kit-section h2 {
  font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-3);
  margin: 0 0 8px; font-weight: 700;
}
.kit-transport { display: flex; flex-wrap: wrap; gap: 6px; }
.kit-btn {
  appearance: none; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--ink);
  border-radius: 8px; padding: 8px 12px; font: inherit; font-size: 0.92rem; cursor: pointer; line-height: 1.1;
}
.kit-btn:hover { border-color: var(--ink-3); }
.kit-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; min-width: 92px; }
.kit-btn.on { border-color: var(--gold); color: var(--gold); }
.kit-seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; }
.kit-seg button {
  appearance: none; border: 0; background: var(--panel-2); color: var(--ink-2); font: inherit; font-size: 0.85rem;
  padding: 7px 9px; cursor: pointer; border-right: 1px solid var(--line-2);
}
.kit-seg button:last-child { border-right: 0; }
.kit-seg button.on { background: var(--ink); color: #000; font-weight: 700; }
.kit-presets { display: flex; flex-wrap: wrap; gap: 6px; }
.kit-presets .kit-btn.on { background: var(--ink); color: #000; border-color: var(--ink); font-weight: 700; }

.kit-slider { margin: 2px 0 10px; }
.kit-slider-head { display: flex; justify-content: space-between; gap: 8px; font-size: 0.9rem; color: var(--ink-2); margin-bottom: 3px; }
.kit-slider-head b { color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.kit-slider input[type=range] { width: 100%; accent-color: var(--accent); }
.kit-check { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--ink-2); margin: 4px 0; cursor: pointer; }
.kit-check input { accent-color: var(--accent); width: 16px; height: 16px; }

.kit-readouts { display: grid; grid-template-columns: 1fr auto; gap: 5px 10px; font-size: 0.92rem; }
.kit-readouts .k { color: var(--ink-2); }
.kit-readouts .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.kit-readouts .v.ok { color: var(--ok); }
.kit-readouts .v.warn { color: var(--warn); }
.kit-readouts .v.bad { color: var(--bad); }
.kit-readouts .v.gold { color: var(--gold); }

.kit-explain { font-size: 0.9rem; color: var(--ink-2); line-height: 1.45; }
.kit-explain summary { cursor: pointer; color: var(--ink); font-weight: 600; margin-bottom: 6px; }
.kit-explain p { margin: 6px 0; }
.kit-explain .eq {
  font-family: "STIX Two Math", "Cambria Math", "Times New Roman", serif; font-size: 1.05rem; color: var(--ink);
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; margin: 6px 0;

.kit-legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 0.82rem; color: var(--ink-2); }
.kit-legend span::before { content: ""; display: inline-block; width: 12px; height: 4px; border-radius: 2px; margin-right: 5px; vertical-align: middle; background: var(--c); }
.kit-note { font-size: 0.78rem; color: var(--ink-3); line-height: 1.4; }

/* predict overlay */
.kit-predict {
  position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.72); backdrop-filter: blur(3px); z-index: 5;
}
.kit-predict.show { display: flex; }
.kit-predict .card {
  width: min(860px, 88%); background: var(--panel); border: 1px solid var(--line-2); border-radius: 14px;

.kit-predict .tag { color: var(--gold); font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; font-size: 0.85rem; }
.kit-predict h3 { font-size: 1.9rem; line-height: 1.25; margin: 10px 0 18px; }
.kit-predict .choices { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
.kit-predict .choices button {
  appearance: none; font: inherit; font-size: 1.15rem; padding: 12px 18px; border-radius: 999px; cursor: pointer;

.kit-predict .choices button.on { border-color: var(--gold); color: var(--gold); }
.kit-predict .hint { color: var(--ink-2); font-size: 1rem; margin: 0 0 18px; }
.kit-predict .go { font-size: 1.15rem; padding: 12px 22px; }

/* errors (also visible in headless screenshots) */
#kit-errors {
  display: none; position: fixed; left: 10px; bottom: 10px; z-index: 99; max-width: 60vw; white-space: pre-wrap;
  background: #300; color: #fbb; border: 1px solid #f55; padding: 8px 10px; font: 12px/1.4 ui-monospace, Menlo, monospace;

<script>

const p1 = new Kit.Plot(document.getElementById('p1'), { title: '', xlabel: 'pitch (deg)', ylabel: 'track push N (× mg)', xmin: 0, xmax: 180, autoX: false, ymin: -1.5, ymax: 3.5,
  series: [{ name: 'N', color: COL.n, width: 3 }, { name: 'suction', color: COL.s }, { name: 'N if stopped', color: COL.n, width: 1.5, dash: [5, 4] }, { name: 'grip needed', color: COL.f, width: 1.5, dash: [5, 4] }],

const p3 = new Kit.Plot(document.getElementById('p3'), { title: 'G-FORCE after release', xlabel: 't after release (s)', ylabel: 'g', xmax: 6, ymax: 4, series: [{ name: 'simulation', color: COL.t, width: 2.5 }], hlines: [{ y: 1, label: '1 g (standing still)', color: 'rgba(255,255,255,0.35)' }] });
function videoMarkers() {

const gDown = new Kit.Gauge(document.getElementById('hudL'), { label: 'DOWNFORCE', unit: 'KG', max: 5000, digits: 0 });

  ctx.fillStyle = '#1a1f26'; ctx.fillRect(V.X(V.xmin), V.gy, V.X(0) - V.X(V.xmin), 6);
  ctx.fillStyle = '#e8473b';

    const [x, z] = outer[i];
    ctx.beginPath(); ctx.moveTo(V.X(towerX), V.Y(z)); ctx.lineTo(V.X(x), V.Y(z)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(V.X(towerX), V.Y(Math.max(0, z - 2.5))); ctx.lineTo(V.X(x), V.Y(z)); ctx.stroke();
  }

  pts.forEach(([x, z], i) => (i ? ctx.lineTo(V.X(x), V.Y(z)) : ctx.moveTo(V.X(x), V.Y(z))));
  for (let i = outer.length - 1; i >= 0; i--) ctx.lineTo(V.X(outer[i][0]), V.Y(outer[i][1]));

  ctx.beginPath(); outer.forEach(([x, z], i) => (i ? ctx.lineTo(V.X(x), V.Y(z)) : ctx.moveTo(V.X(x), V.Y(z)))); ctx.stroke();

}

  ctx.beginPath();
  ctx.moveTo(-2.3, -0.28); ctx.lineTo(2.3, -0.28); ctx.lineTo(2.32, -0.55); ctx.lineTo(1.3, -0.78);
  ctx.lineTo(0.2, -1.18); ctx.lineTo(-1.2, -1.12); ctx.lineTo(-2.25, -0.8); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#20262e';
  ctx.beginPath(); ctx.moveTo(0.95, -0.82); ctx.lineTo(0.15, -1.1); ctx.lineTo(-1.05, -1.05); ctx.lineTo(-1.1, -0.84); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e8473b'; ctx.fillRect(-2.3, -0.62, 0.12, 0.14);
  ctx.fillStyle = '#111';
  [-1.45, 1.45].forEach((x) => { ctx.beginPath(); ctx.arc(x, -0.33, 0.33, 0, Math.PI * 2); ctx.fill(); });
  ctx.fillStyle = '#9aa3ad';
  [-1.45, 1.45].forEach((x) => { ctx.beginPath(); ctx.arc(x, -0.33, 0.15, 0, Math.PI * 2); ctx.fill(); });
  ctx.restore();
  // lateral thruster puff (world horizontal, opposite to the force)
  if (st.phase === 'flight' && Math.abs(st.Fl) > 0.05 * mg) {
    const cx = V.X(st.x), cy = V.Y(z + 0.6), dir = -Math.sign(st.Fl), L = sc * (0.3 + 1.2 * Math.abs(st.Fl) / mg);
    const gr = ctx.createLinearGradient(cx + dir * sc * 2.3, cy, cx + dir * (sc * 2.3 + L), cy);
    gr.addColorStop(0, 'rgba(230,245,255,0.8)'); gr.addColorStop(1, 'rgba(98,198,255,0)');
    ctx.fillStyle = gr; ctx.fillRect(Math.min(cx + dir * sc * 2.3, cx + dir * (sc * 2.3 + L)), cy - sc * 0.15, L, sc * 0.3);
  }
}
function drawForces(ctx, V) {
  const st = sim.st, c = sim.c, mg = c.m * G0, k = 38;
  const ux = -Math.sin(st.phi), uz = Math.cos(st.phi), tx = Math.cos(st.phi), tz = Math.sin(st.phi);
  const z = Math.max(0, st.z);
  const cx = V.X(st.x + ux * c.H / 2), cy = V.Y(z + uz * c.H / 2);
  Kit.arrow(ctx, cx, cy, 0, k, { color: COL.g, label: 'mg (gravity)' });
  if (st.phase !== 'flight' && !st.done) {
    Kit.arrow(ctx, cx, cy, ux * k * st.N / mg, -uz * k * st.N / mg, { color: COL.n, label: 'N (track push)' });
    Kit.arrow(ctx, cx + 4, cy, -ux * k * st.Fs / mg, uz * k * st.Fs / mg, { color: COL.s, label: 'suction' });
    Kit.arrow(ctx, cx, cy, tx * k * st.Ft / mg, -tz * k * st.Ft / mg, { color: COL.f, label: st.Ft >= 0 ? 'drive (friction)' : 'brake (friction)' });
  } else if (st.phase === 'flight' && !st.done) {
    if (st.T > 0) Kit.arrow(ctx, cx, cy, ux * k * st.T / mg, -uz * k * st.T / mg, { color: COL.t, label: 'thrust' });
    if (Math.abs(st.Fl) > 0.02 * mg) Kit.arrow(ctx, cx, cy, k * st.Fl / mg, 0, { color: COL.t, label: 'side thrust' });
  }
}
function phaseInfo() {
  const st = sim.st;
  if (st.done) {
    if (st.outcome === 'landed') return ['LANDED · ' + Kit.fmt(st.tdSpeed, 1) + ' m/s', 'ok', 'Landed'];
    if (st.outcome === 'crash') return ['CRASH · ' + Kit.fmt(st.tdSpeed * 3.6, 0) + ' km/h', 'bad', 'Crash'];
    return ['SLID BACK · not enough grip', 'bad', 'Slid back'];
  }
  if (st.phase === 'hold') return [sim.c.fans_fail && st.fansFailed ? 'FANS FAILED!' : 'HOLDING UPSIDE DOWN', 'ok', 'Holding'];
  if (st.phase === 'flight') {
    if (st.detached && st.t - st.releaseT < 1.2) return ['DETACHED! N < 0', 'bad', 'Detached'];
    if (!sim.c.thrusters) return ['FREE FALL · no thrusters', 'bad', 'Free fall'];
    return Math.abs(SimA.wrap(st.phi)) > 0.3 ? ['FLIPPING IN THE AIR', 'warn', 'Flip'] : (st.T > 0 ? ['BRAKING WITH THRUSTERS', 'warn', 'Braking'] : ['FALLING', 'warn', 'Falling']);
  }
  if (st.failed) return ['SLIDING BACK · grip lost', 'bad', 'Sliding back'];
  if (st.slip) return ['SLIP · tires at the limit', 'bad', 'Slip'];
  return st.s < 0 ? ['RUN-UP', 'ok', 'Run-up'] : ['CLIMBING', 'ok', 'Climbing'];
}
function draw() {
  const { ctx, w, h } = Kit.fitCanvas(document.getElementById('cv'));
  const V = view(w, h), st = sim.st, c = sim.c, mg = c.m * G0;
  drawScene(ctx, w, h, V);
  drawCar(ctx, V);
  if (showForces) drawForces(ctx, V);
  const [msg, cls, ph] = phaseInfo();
  const sEl = document.getElementById('status'); sEl.textContent = msg; sEl.className = 'kit-status ' + cls;
  if (st.done && st.outcome === 'crash') {
    ctx.font = '800 64px -apple-system, Segoe UI, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#ff5a5a';
    ctx.fillText('CRASH ' + Kit.fmt(st.tdSpeed * 3.6, 0) + ' km/h', w / 2, h * 0.32);
  }
  document.getElementById('badge').innerHTML = `Ramp: <b>${c.shape === 'J' ? 'tall J shape' : 'single arc, R = ' + Kit.fmt(sim.track.R, 1) + ' m'}</b> · top <b>67.5 ft</b> at <b>170°</b>`;
  // gauges
  const onTrack = st.phase !== 'flight' && !st.done;
  gDown.set(onTrack ? st.Fs / G0 : 0);
  gG.set(st.gforce);
  let pd = SimA.wrap(st.phi) / DEG; if (onTrack) pd = st.phi / DEG;
  gPitch.set(Math.abs(pd) < 0.05 ? 0 : pd);
  gAlt.set(Math.max(0, st.z) / FT);
  document.getElementById('timer').textContent = Kit.timer(st.t);
  // readouts
  const v = onTrack ? Math.abs(st.v) : Math.hypot(st.vx, st.vz);
  ro.set('phase', ph);
  ro.set('pitch', Kit.fmt(onTrack ? st.phi / DEG : pd, 1) + '°');
  ro.set('speed', Kit.fmt(v, 1) + ' m/s');
  ro.set('alt', Kit.fmt(Math.max(0, st.z), 1) + ' m (' + Kit.fmt(Math.max(0, st.z) / FT, 1) + ' ft)');
  ro.set('N', onTrack ? Kit.fmt(st.N / mg, 2) + ' mg' : '—', onTrack ? (st.N / mg < 0.2 ? 'bad' : 'ok') : '');
  ro.set('Fs', onTrack ? Kit.fmt(st.Fs / mg, 2) + ' mg = ' + Math.round(st.Fs / G0).toLocaleString('en-US') + ' kgf' : 'off');
  ro.set('need', Kit.fmt(SimA.holdSuctionMg(c.top_pitch_deg * DEG), 3) + ' mg = ' + Math.round(SimA.holdSuctionMg(c.top_pitch_deg * DEG) * c.m).toLocaleString('en-US') + ' kgf');
  const used = onTrack && st.N > 0 ? Math.abs(st.Ft) / (c.mu * st.N) : NaN;
  ro.set('grip', Number.isFinite(used) ? Math.round(Math.min(used, 9.99) * 100) + ' %' : '—', used > 1 ? 'bad' : used > 0.8 ? 'warn' : 'ok');
  ro.set('td', st.tdSpeed === null ? '—' : Kit.fmt(st.tdSpeed, 2) + ' m/s (' + Kit.fmt(st.tdSpeed * 3.6, 0) + ' km/h)', st.tdSpeed === null ? '' : st.outcome === 'landed' ? 'ok' : 'bad');
  relBtn.disabled = st.phase !== 'hold';
  p1.draw(); p2.draw(); p3.draw();
}

// ---------- side panel ----------
const side = document.getElementById('side');
const loop = new Kit.Loop({ dt: 0.001, step, draw });
const run = Kit.section(side, 'Run');
const tr = Kit.transport(run, loop, {
  onPlay: () => { if (sim.st.done) { rebuild(); loop.play(); } else loop.toggle(); },
  onReset: () => { rebuild(); loop.pause(); },
  onForces: () => { showForces = !showForces; tr.setForces(showForces); },
  onPredict: () => pred.toggle(),
  onExport: () => Kit.downloadCSV('sim_a_ramp.csv', ['t_s', 'phase', 'x_m', 'z_m', 'pitch_deg', 'N_over_mg', 'gforce'], rows),
});
tr.setForces(showForces);
const relRow = Kit.el('div', 'kit-transport'); run.appendChild(relRow);
const relBtn = Kit.button(relRow, 'Release now ⤓', () => { sim.st.releaseRequest = true; if (!loop.playing) loop.play(); });
const cbAuto = Kit.check(run, { label: 'Auto-release after ' + PA.sim_a.hold_s + ' s at the top', value: true, onChange: (v) => { over.auto_release = v; applyLive(); } });

const scen = Kit.section(side, 'Scenarios');
function setScenario(o) {
  over = Object.assign({}, BASE, { shape: over.shape }, o);
  sSuc.set(over.suction_max_mg); sMu.set(over.mu); sM.set(over.m); sT.set(over.thrust_max_mg); cbThr.set(over.thrusters); cbAuto.set(over.auto_release);
  rebuild(); loop.pause();
}
const settings = Kit.section(side, 'Settings');
const sSuc = Kit.slider(settings, { label: 'Max fan suction', min: 0, max: 3, step: 0.01, value: BASE.suction_max_mg, unit: '× mg', fmt: (v) => v.toFixed(2), onInput: (v) => { over.suction_max_mg = v; presets.clear(); applyLive(); } });
const sMu = Kit.slider(settings, { label: 'Tire grip μ', min: 0.3, max: 1.5, step: 0.05, value: BASE.mu, fmt: (v) => v.toFixed(2), onInput: (v) => { over.mu = v; presets.clear(); applyLive(); } });
const sM = Kit.slider(settings, { label: 'Car mass (assumed)', min: 1200, max: 2600, step: 50, value: BASE.m, unit: 'kg', fmt: (v) => v.toFixed(0), onInput: (v) => { over.m = v; presets.clear(); applyLive(); } });
const sT = Kit.slider(settings, { label: 'Max thrust (assumed)', min: 0, max: 5, step: 0.1, value: BASE.thrust_max_mg, unit: '× mg', fmt: (v) => v.toFixed(1), onInput: (v) => { over.thrust_max_mg = v; presets.clear(); applyLive(); } });
const cbThr = Kit.check(settings, { label: 'Thrusters on', value: true, onChange: (v) => { over.thrusters = v; presets.clear(); applyLive(); } });
Kit.check(settings, { label: 'Tall J shape (arc → vertical → arc)', value: false, onChange: (v) => { over.shape = v ? 'J' : 'arc'; rebuild(); loop.pause(); } });
// Scenario buttons come from note/julia/params/sim_a.json ("presets"), shared with the Julia version.
const presets = Kit.presets(scen, Object.entries(PA.sim_a.presets).map(([key, p]) => (
  { key, label: p.label, apply: () => setScenario(p.overrides || {}) })));

const ro = Kit.readouts(Kit.section(side, 'Readouts'), [
  { key: 'phase', label: 'Phase' }, { key: 'pitch', label: 'Pitch' }, { key: 'speed', label: 'Speed' }, { key: 'alt', label: 'Altitude' },
  { key: 'N', label: 'Track push N' }, { key: 'Fs', label: 'Fan suction' }, { key: 'need', label: 'Suction needed to hang at 170°' },
  { key: 'grip', label: 'Grip used |F|/μN' }, { key: 'td', label: 'Touchdown (vertical)' },
]);
const lg = Kit.section(side, 'Force arrows (F key)');
lg.appendChild(Kit.el('div', 'kit-legend', `<span style="--c:${COL.g}">gravity mg</span><span style="--c:${COL.n}">track push N</span><span style="--c:${COL.s}">suction</span><span style="--c:${COL.f}">drive / friction</span><span style="--c:${COL.t}">thrust</span>`));
const ex = Kit.section(side, '');
ex.appendChild(Kit.el('details', 'kit-explain', `<summary>Explain the physics</summary>
<p>On a curve of radius r, the car needs a push toward the center: <span class="eq">F = mv²/r</span></p>
<p>The track push on the car (perpendicular to the track):</p>
<div class="eq">N = mκv² + mg cos θ + F<sub>suction</sub></div>
<p>κ = 1/r is the curvature, θ the pitch. If N becomes negative, the track would have to pull the car: it falls off.</p>
<p>Tires can push along the track only up to <span class="eq">f ≤ μN</span> More suction → bigger N → more grip.</p>
<p>Stopped at θ = 170°: cos 170° = −0.985, so suction must be at least <b>0.985 mg</b>. Grip must hold mg sin 170° = <b>0.174 mg</b>.</p>
<p>Free fall from height h: <span class="eq">t = √(2h/g)</span> From 20.6 m: 2.05 s, 20.1 m/s (72 km/h).</p>
<p><b>Question:</b> the stream's DOWNFORCE gauge says "4,697 kg". Is kg a unit of force? (It means kilogram-force: 4,697 × 9.81 N ≈ 46 kN.)</p>
<p><b>Question:</b> why does G-FORCE read about 0 while falling? An accelerometer cannot feel gravity in free fall.</p>`));
side.appendChild(Kit.el('p', 'kit-note', 'Teaching model. Gauge numbers as shown on the Tesla live stream (2026-10-15); mass, suction schedule, and thrust are assumptions. Video points assume the still file names are video milliseconds.'));

const pred = new Kit.Predict(document.getElementById('stage'), {
  question: 'The car stops upside down at the top. What keeps it from falling?',
  choices: ['Speed', 'Suction from fans', 'Magnets', "Nothing — it's fake"],
  hint: 'Then: what happens if it just drops from 20 m?',
  onGo: () => loop.play(),
});
pred.onToggle = (on) => tr.setPredict(on);

rebuild();
if (Kit.qs.preset) presets.select(Kit.qs.preset); else presets.select('match');
if (Kit.qs.t) loop.runTo(+Kit.qs.t, () => sim.st.t);
else if (Kit.qs.predict !== '0') pred.show();
</script>
</body>
</html>
